<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Option 2 | Iron Gate Website Design Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1522;
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .preview-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(13, 21, 34, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
    }
    .preview-bar a {
      color: #f3d478;
      text-decoration: none;
      font-weight: 600;
    }
    .preview-bar a:hover { text-decoration: underline; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(212, 175, 55, 0.14);
      border: 1px solid rgba(212, 175, 55, 0.38);
      color: #f3d478;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .canvas {
      max-width: 1440px;
      margin: 0 auto;
      background: #0d1522;
    }
    .canvas img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="preview-bar">
    <div>
      <span class="badge">Option 2 · Design Preview</span>
      <span style="margin-left:10px;color:#cbd5e1;">Full-page visual capture shown while awaiting the exported interactive HTML from Claude's private artifact.</span>
    </div>
    <a href="../">&larr; Back to All 3 Design Options</a>
  </div>
  <main class="canvas">
    <img src="../assets/claude-preview-full.png" alt="Iron Gate Storage Park — Option 2 Design Preview" />
  </main>
</body>
</html>
